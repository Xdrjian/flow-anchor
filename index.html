<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>流与锚 Flow & Anchor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/images/icon.png">
    <meta name="theme-color" content="#8B9A8E">
</head>
<body>
    <!-- Toast 提示 -->
    <div id="toastContainer"></div>

    <!-- 主容器 -->
    <div class="app">
        <!-- 顶部导航 -->
        <header class="header">
            <button class="menu-btn" id="menuBtn">☰</button>
            <h1 class="header-title" id="headerTitle">🎯 今日看板</h1>
            <button class="inbox-btn" id="inboxBtn">
                📮
                <span class="inbox-badge" id="inboxBadge">0</span>
            </button>
        </header>

        <!-- 侧边栏 -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">⚓ 流与锚</div>
            <div class="sidebar-item active home" data-page="daily">🎯 今日看板</div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-item" data-page="pool">� 任务库</div>
            <div class="sidebar-item" data-page="inprogress">� 正处理</div>
            <div class="sidebar-item" data-page="tickler">⏰ 休眠舱</div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-item" data-page="habits">🔋 习惯</div>
            <div class="sidebar-item" data-page="northstar">💡 灯塔</div>
            <div class="sidebar-divider"></div>
            <div class="sidebar-item" data-page="archive">📦 归档</div>
            <div class="sidebar-item" data-page="settings">⚙️ 设置</div>
        </nav>

        <!-- 页面内容区 -->
        <main class="content" id="content">
            <!-- 动态渲染 -->
        </main>

        <!-- 底部输入栏（类似聊天输入框） -->
        <div class="input-bar" id="inputBar">
            <input type="text" class="input-field" id="quickInput" placeholder="写下你的想法..." autocomplete="off">
            <button class="send-btn" id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 操作菜单（替代 prompt 对话框） -->
    <div class="action-sheet-overlay" id="actionSheetOverlay">
        <div class="action-sheet" id="actionSheet">
            <div class="action-sheet-title">选择操作</div>
            <div class="action-sheet-item" data-action="effort">⚡ 设置精力等级</div>
            <div class="action-sheet-item" data-action="inprogress">🚀 标记为正在进行</div>
            <div class="action-sheet-item" data-action="archive">📦 归档</div>
            <div class="action-sheet-item danger" data-action="delete">🗑️ 删除</div>
            <div class="action-sheet-cancel" data-action="cancel">取消</div>
        </div>
    </div>

    <!-- 精力等级选择 -->
    <div class="action-sheet-overlay" id="effortSheetOverlay">
        <div class="action-sheet" id="effortSheet">
            <div class="action-sheet-title">选择精力等级</div>
            <div class="action-sheet-item" data-effort="⚡">⚡ 轻松</div>
            <div class="action-sheet-item" data-effort="⚡⚡">⚡⚡ 中等</div>
            <div class="action-sheet-item" data-effort="⚡⚡⚡">⚡⚡⚡ 费力</div>
            <div class="action-sheet-cancel" data-action="cancel">取消</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
